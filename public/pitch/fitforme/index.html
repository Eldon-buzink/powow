:root {
--navy: #161540;
--heading: #2d2c53;
--lime: #e2f858;
--ink: #161540;
--body: #3a3a5c;
--muted: #5d5d7a;
--line: #dfe3f0;
--input: #505070;
--soft: #f2f5ff;
--soft2: #e8eeff;
--yellow: #fff3b0;
--white: #fff;
--ease: cubic-bezier(.2, .7, .2, 1);
--navH: 56px;
--serif: 'Marcellus', Georgia, 'Times New Roman', serif;
--sans: 'Supreme', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--navH) + 16px); overflow-x: clip; }
body { margin: 0; background: var(--white); color: var(--body); font-family: var(--sans); font-size: 17px; line-height: 1.6; font-weight: 400; overflow-x: clip; }
img { max-width: 100%; display: block; }
a { color: var(--heading); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible, input:focus-visible {
outline: 3px solid var(--heading); outline-offset: 3px; border-radius: 4px; animation: ring .25s var(--ease);
}
.dark a:focus-visible, .dark button:focus-visible, .dark summary:focus-visible, .dark [tabindex]:focus-visible { outline-color: var(--lime); }
h1[tabindex="-1"]:focus { outline: none; }
@keyframes ring { from { outline-offset: 8px; } to { outline-offset: 3px; } }
h1, h2, h3, h4 { color: var(--heading); margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(2.3rem, 7vw, 4rem); line-height: 1.08; }
h2 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; margin-bottom: 14px; }
h3 { font-family: var(--sans); font-weight: 600; font-size: 1.15rem; line-height: 1.3; }
h4 { font-family: var(--sans); font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
p { margin: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
.small { font-size: .85rem; }
.muted { color: var(--muted); }
.center { text-align: center; }
.mt { margin-top: 20px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--sans); font-weight: 600; font-size: .72rem; line-height: 1; letter-spacing: .02em; padding: 5px 8px; border-radius: 999px; vertical-align: 2px; white-space: nowrap; transition: transform .2s var(--ease); }
.pill:hover { transform: translateY(-2px); }
.feit { color: var(--navy); border: 1.5px solid var(--navy); background: var(--white); }
.erv { color: var(--navy); background: #dbe4ff; border: 1.5px solid #dbe4ff; }
.aan { color: #3d3300; background: var(--yellow); border: 1.5px solid #f0dc6a; }
.src { font-size: .78rem; font-weight: 600; color: var(--heading); margin-left: 3px; text-decoration: none; border-bottom: 1px solid currentColor; vertical-align: 2px; }
.dark .src { color: var(--lime); }
.dark .feit { background: transparent; color: #fff; border-color: #fff; }
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px; background: linear-gradient(160deg, var(--soft) 0%, #dfe7ff 100%); transition: opacity .5s var(--ease), visibility .5s; }
.gate.out { opacity: 0; visibility: hidden; }
.gateCard { width: 100%; max-width: 420px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 32px 26px; box-shadow: 0 10px 40px rgba(22, 21, 64, .08); }
.gateCard h1 { font-size: 2rem; margin-bottom: 22px; }
.gateCard label { display: block; font-weight: 600; color: var(--navy); font-size: .95rem; margin-bottom: 6px; }
.gateCard input { width: 100%; font: inherit; font-size: 1rem; color: var(--navy); padding: 12px 14px; border: 1px solid var(--input); border-radius: 6px; background: var(--white); }
.gateCard .btn { width: 100%; margin-top: 14px; }
.gateErr { min-height: 1.4em; margin-top: 10px; color: #a3182c; font-size: .92rem; font-weight: 600; }
.gateNote { margin-top: 18px; font-size: .82rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 24px; border: 0; border-radius: 4px; background: var(--lime); color: var(--navy); font: inherit; font-weight: 600; font-size: 1rem; text-decoration: none; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(226, 248, 88, .35); }
.btn[disabled] { opacity: .6; cursor: progress; transform: none; }
.ghost { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 4px; color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 5px; transition: transform .2s var(--ease); }
.ghost:hover { transform: translateY(-2px); }
.nav { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.navInner { max-width: 1160px; margin: 0 auto; padding: 0 20px; height: var(--navH); display: flex; align-items: center; gap: 12px; }
.navHome { font-family: var(--serif); color: var(--heading); text-decoration: none; font-size: 1.05rem; white-space: nowrap; }
.navList { display: none; list-style: none; margin: 0 auto; padding: 0; gap: 4px; }
.navList a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .88rem; transition: background .25s var(--ease), color .25s var(--ease); }
.navList a:hover { color: var(--navy); }
.navNum { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .7rem; }
.navList a.active { background: var(--navy); color: #fff; }
.navList a.active .navNum { background: var(--lime); color: var(--navy); border-color: var(--lime); }
.navNow:has(.navNowLabel:empty) { visibility: hidden; }
.navNow { margin-left: auto; font-size: .85rem; font-weight: 600; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navNowNum { color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.lang button { font: inherit; font-size: .78rem; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 9px; cursor: pointer; min-height: 30px; }
.lang button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.navProgress { height: 3px; background: transparent; }
.navProgress span { display: block; height: 100%; width: 100%; background: var(--navy); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
@media (min-width: 1000px) {
.navList { display: flex; }
.navNow { display: none; }
}
.dark { background: var(--navy); color: #d9dbf2; }
.dark h1, .dark h2 { color: #fff; }
.hero { padding: 48px 0 56px; overflow: hidden; }
.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); margin-bottom: 18px; }
.heroSub { font-size: 1.2rem; line-height: 1.5; max-width: 34ch; margin-top: 18px; color: #fff; }
.byline { margin-top: 16px; font-size: .85rem; max-width: 62ch; color: #b7b9da; }
.loop { position: relative; margin: 40px 0 0; }
.loopNodes { list-style: none; margin: 0; padding: 0 0 0 0; display: grid; gap: 18px; position: relative; }
.loopNodes::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: rgba(255, 255, 255, .25); }
.loopNodes::after { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: var(--lime); transform-origin: 50% 0; transform: scaleY(0); }
.loop.drawn .loopNodes::after { transform: scaleY(1); transition: transform 2.5s var(--ease); }
.node { position: relative; display: flex; align-items: center; gap: 14px; color: #fff; outline-offset: 6px; opacity: 0; transform: scale(.85); }
.loop.drawn .node { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .5s var(--ease); }
.loop.drawn .node:nth-child(2) { transition-delay: .6s; } .loop.drawn .node:nth-child(3) { transition-delay: 1.2s; } .loop.drawn .node:nth-child(4) { transition-delay: 1.8s; }
.nodeDot { flex: none; position: relative; z-index: 1; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--navy); border: 2px solid rgba(255, 255, 255, .5); font-weight: 600; transition: transform .4s var(--ease), background .4s var(--ease), border-color .4s var(--ease), color .4s var(--ease); }
.nodeText { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.node.on .nodeDot { transform: scale(1.15); background: var(--lime); border-color: var(--lime); color: var(--navy); }
.chips { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .4); color: #fff; font-weight: 600; font-size: .85rem; transition: background .4s var(--ease), color .4s var(--ease), border-color .4s var(--ease), transform .2s var(--ease); }
.chip:hover { transform: translateY(-2px); }
.chip.on { background: var(--lime); border-color: var(--lime); color: var(--navy); }
.chipMuted { border-style: dashed; color: #c9cbe8; }
.chipMuted.on { background: transparent; color: #fff; border-color: var(--lime); animation: pulse 1.6s var(--ease) 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(226, 248, 88, .25); } }
.loopCaption { margin-top: 22px; max-width: 62ch; font-size: .92rem; color: #b7b9da; }
.hero .ghost { margin-top: 22px; }
@media (min-width: 768px) {
.hero { padding: 80px 0 88px; }
.loopNodes { grid-template-columns: repeat(4, 1fr); gap: 12px; }
.loopNodes::before, .loopNodes::after { left: 12.5%; right: 12.5%; top: 21px; bottom: auto; width: auto; height: 2px; }
.loopNodes::after { transform-origin: 0 50%; transform: scaleX(0); }
.loop.drawn .loopNodes::after { transform: scaleX(1); }
.node { flex-direction: column; text-align: center; gap: 12px; }
.nodeText { max-width: 18ch; }
.chips { justify-content: center; margin-top: 40px; }
}
details::details-content { block-size: 0; overflow: hidden; transition: block-size .4s var(--ease), content-visibility .4s allow-discrete; }
details[open]::details-content { block-size: auto; }
@supports (interpolate-size: allow-keywords) { :root { interpolate-size: allow-keywords; } }
.section { padding: 64px 0; }
.section.soft { background: linear-gradient(180deg, var(--soft) 0%, #fff 100%); }
@media (min-width: 768px) { .section { padding: 104px 0; } }

.meta3 { margin: 8px 0 0; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
@media (min-width: 640px) { .meta3 { grid-template-columns: repeat(3, 1fr); } }
.meta3 dt { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meta3 dd { margin: 2px 0 0; font-size: .95rem; }
.ideaList { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.shots { display: grid; gap: 22px; }
.shotCard { margin: 0; display: grid; gap: 14px; }
@media (min-width: 640px) { .shotCard { grid-template-columns: 240px 1fr; align-items: start; } }
.shotCard img { border-radius: 10px; border: 1px solid var(--line); width: 100%; height: auto; }
.shotCard h4 { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--navy); margin-bottom: 8px; }
.shotCard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: .95rem; }
.shotNum { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--navy); color: var(--lime); font-size: .8rem; }
.vraag { margin-top: 4px; color: var(--navy); font-weight: 600; font-size: .9rem; }
.vraag::before { content: "→ "; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .modal[open] { animation: none; } }
.metric { display: inline-block; background: var(--lime); color: var(--navy); font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.teams, .learn { margin-top: 16px; }
.teamGrid { list-style: none; margin: 4px 0 12px; padding: 0; display: grid; gap: 10px; }
@media (min-width: 640px) { .teamGrid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .teamGrid { grid-template-columns: repeat(5, 1fr); } }
.teamGrid li { display: grid; gap: 4px; align-content: start; padding: 14px; border-radius: 12px; background: var(--soft); font-size: .92rem; }
.teamGrid b { color: var(--navy); }
.learnFlow { list-style: none; margin: 6px 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; counter-reset: lf; }
.learnFlow li { counter-increment: lf; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 600; font-size: .88rem; }
.learnFlow li::before { content: counter(lf); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--lime); color: var(--navy); font-size: .72rem; }
.learnFlow li:not(:last-child)::after { content: "→"; margin-left: 6px; color: var(--lime); }
.learn .dash { margin-bottom: 12px; }
.dataFlow { margin-top: 28px; }
.flowSteps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; counter-reset: fs; }
@media (min-width: 1000px) { .flowSteps { grid-template-columns: repeat(5, 1fr); align-items: start; } }
.flowSteps details { background: var(--soft); border-radius: 12px; position: relative; }
.flowSteps summary { display: grid; gap: 3px; padding: 14px; }
.flowSteps summary b { color: var(--navy); }
.flowSteps summary span:not(.fsN):not(.moreLabel) { font-size: .88rem; }
.flowSteps details > p, .flowSteps details > ul { padding: 0 14px 14px; font-size: .9rem; margin: 0; }
.flowSteps details > ul { padding-left: 32px; }
.fsN { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--lime); font-size: .78rem; font-weight: 600; margin-bottom: 4px; }
@media (min-width: 1000px) { .flowSteps li:not(:last-child) details::after { content: "→"; position: absolute; right: -8px; top: 18px; transform: translateX(50%); color: var(--navy); font-weight: 600; } }
.trail { margin-top: 18px; padding: 14px 16px; border: 1px dashed var(--input); border-radius: 12px; }
.trailHead { font-weight: 600; color: var(--navy); font-size: .92rem; margin-bottom: 10px; }
.trailHead .muted { font-weight: 400; }
.trail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
@media (min-width: 900px) { .trail ol { grid-template-columns: repeat(4, 1fr); } }
.trail li { display: grid; gap: 2px; font-size: .9rem; padding: 10px 12px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); }
.trail li:last-child { background: var(--navy); color: #fff; border-color: var(--navy); }
.trail li:last-child b { color: var(--lime); }
.trail b { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.aiCard { margin-top: 16px; }
.aiGrid { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 10px; }
@media (min-width: 640px) { .aiGrid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .aiGrid { grid-template-columns: repeat(4, 1fr); } }
.aiGrid li { display: grid; gap: 4px; align-content: start; padding: 16px; border-radius: 12px; background: var(--soft); font-size: .92rem; }
.aiGrid b { color: var(--navy); font-size: 1rem; }
.aiPhase { justify-self: start; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--lime); padding: 3px 8px; border-radius: 4px; }
.matrixWrap { display: grid; gap: 20px; align-items: start; }
@media (min-width: 900px) { .matrixWrap { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.matrixCard { padding: 20px; }
.matrix { position: relative; aspect-ratio: 1.6 / 1; margin: 14px 0 30px 30px; border-left: 2px solid var(--navy); border-bottom: 2px solid var(--navy); display: grid; grid-template: 1fr 1fr / 1fr 1fr; }
.quad { border-right: 1px dashed var(--line); border-top: 1px dashed var(--line); padding: 8px; font-size: .75rem; font-weight: 600; color: var(--muted); }
.quadStart { background: #f4fbd0; color: var(--navy); }
.axisY { position: absolute; left: -28px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.axisX { position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mdot { position: absolute; transform: translate(-50%, 50%); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 600; background: var(--white); border: 2px solid var(--input); color: var(--navy); }
.mdotStart { background: var(--lime); border-color: var(--navy); }
.keyList { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; font-size: .92rem; }
.keyList li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.keyList .mdot { position: static; transform: none; width: 26px; height: 26px; font-size: .75rem; }
.kTag { font-size: .72rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pickRule { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 6px; font-size: .92rem; }
.takeaway { font-weight: 600; color: var(--navy); border-left: 3px solid var(--lime); padding-left: 10px; }
@media (max-width: 480px) { .mdot { width: 24px; height: 24px; font-size: .7rem; } }
.insights { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 10px; }
@media (min-width: 640px) { .insights { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .insights { grid-template-columns: repeat(4, 1fr); } }
.insights a { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 18px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .05); color: #fff; text-decoration: none; transition: transform .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease); }
.insights a:hover { transform: translateY(-3px); border-color: var(--lime); background: rgba(255, 255, 255, .09); }
.insights b { font-size: 1.05rem; line-height: 1.3; }
.inN { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--lime); color: var(--navy); font-weight: 600; }
.hero .loopCaption .erv { background: #34336e; border-color: #34336e; color: #fff; }
.chap { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; counter-reset: ch; }
@media (min-width: 768px) { .chap { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .chap { grid-template-columns: repeat(4, 1fr); } }
.chapBox { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 16px; background: var(--white); border: 1px solid var(--line); font-size: .95rem; position: relative; }
.chapK { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chapHow { border: 2px solid var(--navy); }
.chapHow .chapK { color: var(--navy); }
.chapCheck { background: var(--yellow); border-color: #f0dc6a; }
.chapCheck .chapK { color: #6b5a00; }
.chapBox .dash { padding-left: 18px; display: grid; gap: 6px; }
.metricLine { margin-top: auto; font-size: .85rem; font-weight: 600; color: var(--navy); }
@media (min-width: 1100px) { .chapBox:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 18px; transform: translateX(50%); color: var(--navy); font-weight: 600; z-index: 1; } }
.chap + .card, .chap + .sprint { margin-top: 20px; }
.tree.compact { margin-bottom: 28px; }
.tStatic { cursor: default; }
.tStatic:hover { transform: none; box-shadow: none; border-color: var(--line); border-top-color: var(--lime); }
.tGoal .src { color: var(--lime); }
</style>

  const $ = (s, r = document) => r.querySelector(s)
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s))
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  const payloadEl = document.getElementById('payload')
  const gate = document.getElementById('gate')
  const app = document.getElementById('app')
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))

  let DATA = null
  let cleanups = []
  const onCleanup = (fn) => cleanups.push(fn)

  /* ---------- gate ---------- */
  async function decrypt(pass) {
    const enc = new TextEncoder()
    const base = await crypto.subtle.importKey('raw', enc.encode(pass.trim().normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(payloadEl.dataset.salt), iterations: Number(payloadEl.dataset.iter), hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    )
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(payloadEl.dataset.iv) }, key, b64(payloadEl.textContent.trim()))
    return JSON.parse(new TextDecoder().decode(plain))
  }

  const form = $('#gateForm')
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = $('button', form)
    const err = $('#gateErr')
    const input = $('#code')
    btn.disabled = true
    err.textContent = ''
    try {
      DATA = await decrypt(input.value)
    } catch (_) {
      btn.disabled = false
      err.textContent = err.dataset.msg
      input.setAttribute('aria-invalid', 'true')
      input.select()
      return
    }
    input.value = ''
    mount('nl')
    gate.classList.add('out')
    setTimeout(() => gate.remove(), reduce ? 0 : 520)
    const h1 = $('h1', app)
    h1.setAttribute('tabindex', '-1')
    h1.focus({ preventScroll: true })
  })

  /* ---------- mount / language ---------- */
  function mount(lang, keep) {
    cleanups.forEach((fn) => fn())
    cleanups = []
    app.innerHTML = DATA[lang]
    app.hidden = false
    document.documentElement.lang = lang
    $$('img[data-img]', app).forEach((img) => (img.src = DATA.img[img.dataset.img]))
    initNav()
    initReveal()
    initHero()
    initModals()
    initObservers()
    $$('.lang button', app).forEach((b) =>
      b.addEventListener('click', () => {
        if (b.dataset.lang === document.documentElement.lang) return
        // keep the reader at the same section after switching
        const anchor = $$('[id]', app).filter((el) => el.matches('section, header, .card')).find((el) => el.getBoundingClientRect().bottom > 80)
        const id = anchor && anchor.id
        const offset = anchor ? anchor.getBoundingClientRect().top : 0
        mount(b.dataset.lang, true)
        const again = id && document.getElementById(id)
        if (again) window.scrollTo({ top: window.scrollY + again.getBoundingClientRect().top - offset, behavior: 'instant' })
        $(`.lang button[data-lang="${b.dataset.lang}"]`, app).focus()
      }),
    )
    if (!keep) window.scrollTo({ top: 0, behavior: 'instant' })
  }

  /* ---------- nav ---------- */
  function initNav() {
    const links = $$('.navList a', app)
    const sections = links.map((a) => document.getElementById(a.dataset.step))
    const now = $('.navNowNum', app)
    const nowLabel = $('.navNowLabel', app)
    const bar = $('.navProgress span', app)
    const setActive = (id) => {
      let idx = -1
      links.forEach((a, i) => {
        const on = a.dataset.step === id
        a.classList.toggle('active', on)
        if (on) { a.setAttribute('aria-current', 'step'); idx = i } else a.removeAttribute('aria-current')
      })
      now.textContent = idx >= 0 ? `${idx + 1}/${links.length}` : ""
      nowLabel.textContent = idx >= 0 ? links[idx].querySelector('.navLabel').textContent : ''
    }
    const visible = new Set()
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => (e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id)))
        const first = sections.find((s) => visible.has(s.id))
        setActive(first ? first.id : null)
      },
      { rootMargin: '-40% 0px -55% 0px' },
    )
    sections.forEach((s) => io.observe(s))
    let raf = 0
    const onScroll = () => {
      cancelAnimationFrame(raf)
      raf = requestAnimationFrame(() => {
        const max = document.documentElement.scrollHeight - window.innerHeight
        bar.style.setProperty('--p', max > 0 ? Math.min(1, window.scrollY / max).toFixed(4) : 0)
      })
    }
    window.addEventListener('scroll', onScroll, { passive: true })
    onScroll()
    onCleanup(() => { io.disconnect(); window.removeEventListener('scroll', onScroll) })
  }

  /* ---------- reveals ---------- */
  function initReveal() {
    const els = $$('.reveal', app)
    els.forEach((el) => {
      const sibs = Array.from(el.parentElement.children).filter((c) => c.classList.contains('reveal'))
      el.style.setProperty('--stagger', `${Math.min(sibs.indexOf(el), 6) * 60}ms`)
    })
    if (reduce) { els.forEach((el) => el.classList.add('in')); return }
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }),
      { rootMargin: '0px 0px -8% 0px', threshold: 0.12 },
    )
    els.forEach((el) => io.observe(el))
    onCleanup(() => io.disconnect())
  }

  /* ---------- hero loop ---------- */
  function initHero() {
    const loop = $('.loop', app)
    if (!loop) return
    const hero = $('.hero', app)
    const nodes = $$('.node', loop)
    const chips = $$('.chip', loop)
    let userMoved = false
    const setNode = (n) => {
      nodes.forEach((el) => el.classList.toggle('on', Number(el.dataset.node) === n))
      chips.forEach((c) => c.classList.toggle('on', Number(c.dataset.for) === n))
    }
    const timers = []
    if (reduce) {
      loop.classList.add('drawn')
      setNode(1)
    } else {
      requestAnimationFrame(() => requestAnimationFrame(() => loop.classList.add('drawn')))
      // walk the loop once after it is drawn, then follow the reader
      ;[1, 2, 3, 4].forEach((n, i) => timers.push(setTimeout(() => { if (!userMoved) setNode(n) }, 2600 + i * 900)))
    }
    const fromScroll = () => {
      const r = hero.getBoundingClientRect()
      const p = Math.max(0, Math.min(0.999, -r.top / (r.height * 0.55)))
      if (window.scrollY > 4) { userMoved = true; setNode(1 + Math.floor(p * 4)) }
    }
    nodes.forEach((el) => {
      const pick = () => { userMoved = true; setNode(Number(el.dataset.node)) }
      el.addEventListener('mouseenter', pick)
      el.addEventListener('focus', pick)
    })
    window.addEventListener('scroll', fromScroll, { passive: true })
    onCleanup(() => { timers.forEach(clearTimeout); window.removeEventListener('scroll', fromScroll) })
  }

  /* ---------- modals (native <dialog>: focus trap, Esc, backdrop) ---------- */
  function initModals() {
    let opener = null
    const openSources = () => { const box = document.getElementById('bronnen'); if (box) box.open = true }
    const open = (id, from) => {
      const dlg = document.getElementById(id)
      if (!dlg || dlg.open) return
      opener = from
      dlg.showModal()
      dlg.scrollTop = 0
    }
    const onClick = (e) => {
      const trigger = e.target.closest('[data-modal]')
      if (trigger) { open(trigger.dataset.modal, trigger); return }
      const link = e.target.closest('a[href^="#bron-"]')
      const dlg = e.target.closest('dialog.modal')
      if (link) openSources()
      if (!dlg) return
      // close on the x, on the backdrop, or when following a source link out of the modal
      if (e.target.closest('[data-close]') || e.target === dlg || link) {
        dlg.close()
        if (link) {
          const t = document.getElementById(link.getAttribute('href').slice(1))
          if (t) { e.preventDefault(); t.scrollIntoView({ block: 'center' }) }
        }
      }
    }
    const onClose = (e) => { if (e.target.matches('dialog.modal') && opener) { opener.focus({ preventScroll: true }); opener = null } }
    app.addEventListener('click', onClick)
    app.addEventListener('close', onClose, true)
    onCleanup(() => { app.removeEventListener('click', onClick); app.removeEventListener('close', onClose, true) })
  }

  /* ---------- one-off scroll states ---------- */
  function initObservers() {
    const targets = $$('.converge, .station', app)
    const rows = $$('.rows li', app)
    if (reduce) { targets.forEach((t) => t.classList.add('in')); return }
    const io = new IntersectionObserver(
      (es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }),
      { threshold: 0.25 },
    )
    targets.forEach((t) => io.observe(t))
    const timers = []
    const rhythm = $('.rhythm', app)
    const rio = new IntersectionObserver((es) => {
      if (!es[0].isIntersecting) return
      rio.disconnect()
      rows.forEach((r, i) => {
        timers.push(setTimeout(() => r.classList.add('lit'), 300 + i * 380))
        timers.push(setTimeout(() => r.classList.remove('lit'), 1000 + i * 380))
      })
    }, { threshold: 0.4 })
    if (rhythm) rio.observe(rhythm)
    onCleanup(() => { io.disconnect(); rio.disconnect(); timers.forEach(clearTimeout) })
  }
})()

</script>
</body>
</html>
